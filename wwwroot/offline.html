<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>You're Offline - HemVirtues</title>
    <style>
        :root {
            --primary: #b693ad;
            --background: #f5e2e2;
            --text-color: #4a3b45;
            --card-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .offline-container {
            background-color: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.5s ease-in-out;
        }

        .illustration {
            margin-bottom: 24px;
        }

            .illustration svg {
                width: 90px;
                height: 90px;
                fill: var(--primary);
            }

        h1 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        p {
            font-size: 15px;
            line-height: 1.5;
            color: #7a6875;
            margin-bottom: 24px;
        }

        .retry-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 50px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(182, 147, 173, 0.4);
        }

            .retry-btn:hover {
                background-color: #9f7c96;
            }

            .retry-btn:active {
                transform: scale(0.97);
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="illustration">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.89.19-4.15.54L18.18 20.37C21.43 18.06 23.33 14.65 23.64 7zM3.42 3.65L2 5.07l2.12 2.12C2.78 8.17 1.67 9.4 1 10.74l2.09 1.15c.5-1.02 1.3-1.99 2.37-2.78l3.19 3.19c-1.42.23-2.65.86-3.69 1.74l2.09 1.15c.57-.48 1.25-.86 2.01-1.11L14.7 18l1.42-1.42L3.42 3.65z" />
            </svg>
        </div>
        <h1>Connection Lost</h1>
        <p>It looks like you've lost your internet connection. Please check your network settings and try again to continue using HemVirtues.</p>
        <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
